name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: medstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npm run db:generate --workspace=@medstore/api

      - name: Run Migrations
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/medstore_test"
        run: npm run db:migrate --workspace=@medstore/api

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/medstore_test"
          NODE_ENV: test
          SESSION_SECRET: test_session_secret_for_ci_at_least_32_chars_long
        run: npm test

      - name: Build Workspaces
        run: npm run build
